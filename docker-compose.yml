version: "3"
services:
  postgres:
    container_name: learny-postgres
    image: postgres:13.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DATABASE: postgres
    ports:
      - "5432:5432"
    volumes:
      - /tmp/postgres:/tmp/postgres

  redis:
    image: redis:7-alpine
    container_name: learny-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5